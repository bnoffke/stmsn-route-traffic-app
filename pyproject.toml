[project]
name = "stmsn-route-traffic-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "bnoffke", email = "bnoffk3790@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "folium>=0.20.0",
    "numpy>=2.5.1",
    "pandas>=3.0.3",
    "plotly>=6.9.0",
    "polyline>=2.0.4",
    "stmsn-query",
    "streamlit>=1.59.2",
    "streamlit-folium>=0.27.2",
    "tzdata>=2024.1",
]

[project.scripts]
stmsn-route-traffic-app = "stmsn_route_traffic_app:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
stmsn-query = { git = "https://github.com/bnoffke/stmsn-query" }
